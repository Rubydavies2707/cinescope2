<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineScope - Discover Movies</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <!-- NAVBAR (injected by navbar.js) -->
  <nav id="navbar"></nav>

  <!-- SEARCH + ADVANCED FILTERS -->
  <section id="control-panel">

    <div id="search-bar">
      <input type="text" id="search" placeholder="Search for a movie, actor, or director...">
      <div id="autocomplete"></div>
      <button id="search-btn" class="primary-btn">Search</button>
    </div>

    <!-- ADVANCED FILTERS -->
    <div id="advanced-filters">
      <button id="toggle-filters" class="secondary-btn">🔍 Advanced Filters</button>
      
      <div id="filter-panel" class="hidden">
        <div class="filter-row">
          <div class="filter-group">
            <label>Sort By</label>
            <select id="sort-options">
              <option value="none">Relevance</option>
              <option value="title-asc">Title A–Z</option>
              <option value="title-desc">Title Z–A</option>
              <option value="year-asc">Year ↑</option>
              <option value="year-desc">Year ↓</option>
              <option value="rating-desc">Rating ↓</option>
              <option value="rating-asc">Rating ↑</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Min Rating</label>
            <select id="rating-filter">
              <option value="0">Any Rating</option>
              <option value="7">7.0+</option>
              <option value="8">8.0+</option>
              <option value="9">9.0+</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Decade</label>
            <select id="decade-filter">
              <option value="all">All Decades</option>
              <option value="2020">2020s</option>
              <option value="2010">2010s</option>
              <option value="2000">2000s</option>
              <option value="1990">1990s</option>
              <option value="1980">1980s</option>
              <option value="1970">1970s</option>
              <option value="pre1970">Pre-1970</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Runtime</label>
            <select id="runtime-filter">
              <option value="all">Any Length</option>
              <option value="short">Short (&lt; 90 min)</option>
              <option value="medium">Medium (90-120 min)</option>
              <option value="long">Long (> 120 min)</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Type</label>
            <select id="type-filter">
              <option value="all">All Types</option>
              <option value="movie">Movies</option>
              <option value="series">TV Series</option>
            </select>
          </div>
        </div>

        <div class="filter-actions">
          <button id="apply-filters" class="primary-btn">Apply Filters</button>
          <button id="reset-filters" class="secondary-btn">Reset</button>
          <button id="clear-cache" class="secondary-btn">Clear Cache</button>
        </div>
      </div>
    </div>

  </section>

  <!-- SPINNER -->
  <div id="spinner" class="hidden"></div>

  <!-- RECENTLY VIEWED -->
  <section id="recently-viewed"></section>

  <!-- SEARCH RESULTS -->
  <div id="results"></div>

  <!-- MODAL -->
  <div id="modal">
    <div id="modal-content">
      <span id="close-modal">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="navbar.js"></script>
  <script src="auth.js"></script>
  <script src="omdb.js"></script>
</body>
</html>
