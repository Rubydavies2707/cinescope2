<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineScope - Film Diary</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <!-- NAVBAR (injected by navbar.js) -->
  <nav id="navbar"></nav>


  <!-- DIARY PAGE -->
  <div class="page-container">
    <header class="page-header">
      <h1>Your Film Diary</h1>
      <p class="subtitle">A personal record of every film you've watched</p>
    </header>

    <!-- DIARY STATS -->
    <section id="diary-stats">
      <div class="stat-card">
        <div class="stat-icon">📖</div>
        <div class="stat-value" id="diary-total">0</div>
        <div class="stat-label">Films Logged</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⭐</div>
        <div class="stat-value" id="diary-rated">0</div>
        <div class="stat-label">Rated</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="diary-reviewed">0</div>
        <div class="stat-label">Reviewed</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="diary-this-month">0</div>
        <div class="stat-label">This Month</div>
      </div>
    </section>

    <!-- FILTERS & SORT -->
    <section id="diary-controls">
      <div class="diary-filter-row">
        <div class="filter-group">
          <label>Sort By</label>
          <select id="diary-sort">
            <option value="date-desc">Newest First</option>
            <option value="date-asc">Oldest First</option>
            <option value="rating-desc">Highest Rated</option>
            <option value="rating-asc">Lowest Rated</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Filter by Rating</label>
          <select id="diary-rating-filter">
            <option value="all">All Ratings</option>
            <option value="5">⭐⭐⭐⭐⭐ (5 stars)</option>
            <option value="4">⭐⭐⭐⭐ (4 stars)</option>
            <option value="3">⭐⭐⭐ (3 stars)</option>
            <option value="2">⭐⭐ (2 stars)</option>
            <option value="1">⭐ (1 star)</option>
            <option value="unrated">Unrated</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Filter by Month</label>
          <select id="diary-month-filter">
            <option value="all">All Time</option>
          </select>
        </div>
      </div>
    </section>

    <!-- DIARY ENTRIES -->
    <section id="diary-entries">
      <!-- Populated by JS -->
    </section>

    <!-- EMPTY STATE -->
    <section id="diary-empty" class="hidden">
      <div class="empty-state">
        <div class="empty-icon">📖</div>
        <h2>No films logged yet</h2>
        <p>Start exploring and watching films to build your personal diary!</p>
        <a href="index.html" class="primary-btn">🔍 Discover Films</a>
      </div>
    </section>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="navbar.js"></script>
  <script src="auth.js"></script>
  <script src="firestore-helper.js"></script>
  <script src="diary.js"></script>
</body>
</html>
